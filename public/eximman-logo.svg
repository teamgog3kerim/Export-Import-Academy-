<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullRibbonGrad" x1="120" y1="210" x2="280" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A160F" />
      <stop offset="45%" stop-color="#4B281B" />
      <stop offset="70%" stop-color="#3D1F14" />
      <stop offset="100%" stop-color="#2A160F" />
    </linearGradient>

    <linearGradient id="fullHighlightGrad" x1="130" y1="220" x2="270" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B472C" />
      <stop offset="50%" stop-color="#A56743" />
      <stop offset="100%" stop-color="#6F3F27" />
    </linearGradient>
  </defs>

  <!-- EMBLEM CENTERED AT (200, 140) WITH RADIUS 85 -->
  <g transform="translate(0, 0)">
    <!-- Globe Framework -->
    <g stroke="#3C2117" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="200" cy="140" r="82" stroke-width="5" stroke="#341C14" fill="none" />
      <!-- Meridians -->
      <path d="M 200 58 C 200 58 200 106 200 118" stroke-width="3.2" opacity="0.85" />
      <path d="M 138 95 C 166 84 234 84 262 95" stroke-width="3.2" opacity="0.8" />
      <path d="M 155 70 C 178 64 222 64 245 70" stroke-width="2.8" opacity="0.75" />
      <path d="M 168 60 C 154 90 154 112 156 128" stroke-width="2.8" opacity="0.65" />
      <path d="M 232 60 C 246 90 246 112 244 128" stroke-width="2.8" opacity="0.65" />

      <!-- Lower Hemisphere -->
      <path d="M 200 162 C 200 174 200 222 200 222" stroke-width="3.2" opacity="0.85" />
      <path d="M 138 185 C 166 196 234 196 262 185" stroke-width="3.2" opacity="0.8" />
      <path d="M 155 210 C 178 216 222 216 245 210" stroke-width="2.8" opacity="0.75" />
      <path d="M 168 220 C 154 190 154 168 156 152" stroke-width="2.8" opacity="0.65" />
      <path d="M 232 220 C 246 190 246 168 244 152" stroke-width="2.8" opacity="0.65" />
    </g>

    <!-- Cargo Box (Top-Left) -->
    <g transform="translate(150, 85)">
      <polygon points="20,0 40,10 20,20 0,10" fill="#D3A076" stroke="#2E1810" stroke-width="2.2" stroke-linejoin="round" />
      <polygon points="0,10 20,20 20,40 0,30" fill="#8B5330" stroke="#2E1810" stroke-width="2.2" stroke-linejoin="round" />
      <polygon points="20,20 40,10 40,30 20,40" fill="#A86C43" stroke="#2E1810" stroke-width="2.2" stroke-linejoin="round" />
      <line x1="10" y1="5" x2="30" y2="15" stroke="#3D1F14" stroke-width="2.2" />
      <line x1="20" y1="20" x2="20" y2="40" stroke="#3D1F14" stroke-width="2" />
    </g>

    <!-- Quality Seal (Bottom-Right) -->
    <g transform="translate(214, 150)">
      <polygon points="22,2 39,12 39,32 22,42 5,32 5,12" fill="none" stroke="#8B5330" stroke-width="3" stroke-linejoin="round" />
      <circle cx="22" cy="-2" r="2" fill="#A56743" />
      <circle cx="43" cy="10" r="2" fill="#A56743" />
      <circle cx="43" cy="34" r="2" fill="#A56743" />
      <circle cx="22" cy="46" r="2" fill="#A56743" />
      <circle cx="1" cy="34" r="2" fill="#A56743" />
      <circle cx="1" cy="10" r="2" fill="#A56743" />
      <path d="M 13 22 L 19 28 L 31 16" fill="none" stroke="#2E1810" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- S-Ribbon -->
    <path d="M 138 186 
             C 161 161, 180 150, 202 135
             C 229 116, 247 101, 256 81
             L 272 91
             C 261 113, 241 130, 215 149
             C 190 167, 170 180, 150 202 Z" 
          fill="url(#fullRibbonGrad)" 
          stroke="#23120C" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <path d="M 145 193 
             C 165 173, 186 161, 209 143
             C 233 123, 251 108, 263 85" 
          stroke="url(#fullHighlightGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Arrowheads -->
    <g transform="translate(242, 50) rotate(48)">
      <polygon points="20,0 40,40 20,31 0,40" fill="url(#fullRibbonGrad)" stroke="#23120C" stroke-width="2.8" stroke-linejoin="round" />
      <polygon points="20,0 20,31 0,40" fill="#8B5330" opacity="0.4" />
      <line x1="20" y1="0" x2="20" y2="31" stroke="#A56743" stroke-width="2.2" />
    </g>
    <g transform="translate(136, 222) rotate(228)">
      <polygon points="20,0 40,40 20,31 0,40" fill="url(#fullRibbonGrad)" stroke="#23120C" stroke-width="2.8" stroke-linejoin="round" />
      <polygon points="20,0 20,31 0,40" fill="#8B5330" opacity="0.4" />
      <line x1="20" y1="0" x2="20" y2="31" stroke="#A56743" stroke-width="2.2" />
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <!-- EXIMMAN -->
  <text x="200" y="325" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="62" 
        letter-spacing="4" 
        fill="#2A160F">EXIMMAN</text>

  <!-- EXPORT • IMPORT • MANAGER -->
  <text x="200" y="365" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="16" 
        letter-spacing="5" 
        fill="#8B5330">EXPORT • IMPORT • MANAGER</text>
</svg>
