<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients matching the rich espresso and caramel leather palette -->
    <linearGradient id="eximRibbonGrad" x1="30" y1="160" x2="170" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A160F" />
      <stop offset="45%" stop-color="#4B281B" />
      <stop offset="70%" stop-color="#3D1F14" />
      <stop offset="100%" stop-color="#2A160F" />
    </linearGradient>

    <linearGradient id="eximHighlightGrad" x1="40" y1="170" x2="160" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B472C" />
      <stop offset="50%" stop-color="#A56743" />
      <stop offset="100%" stop-color="#6F3F27" />
    </linearGradient>

    <linearGradient id="globeGrad" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3C2117" />
      <stop offset="100%" stop-color="#2A160F" />
    </linearGradient>
  </defs>

  <!-- Globe Background / Circle Framework -->
  <g stroke="#3C2117" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Globe Perimeter Circle -->
    <circle cx="100" cy="100" r="74" stroke-width="4.5" stroke="#381E15" fill="none" opacity="0.95" />

    <!-- Upper Globe Meridians and Parallels -->
    <path d="M 100 26 C 100 26 100 70 100 80" stroke-width="3" opacity="0.85" />
    <path d="M 45 60 C 70 50 130 50 155 60" stroke-width="3" opacity="0.8" />
    <path d="M 60 38 C 80 32 120 32 140 38" stroke-width="2.5" opacity="0.75" />
    <path d="M 72 28 C 60 55 60 75 62 88" stroke-width="2.5" opacity="0.65" />
    <path d="M 128 28 C 140 55 140 75 138 88" stroke-width="2.5" opacity="0.65" />

    <!-- Lower Globe Meridians and Parallels -->
    <path d="M 100 120 C 100 130 100 174 100 174" stroke-width="3" opacity="0.85" />
    <path d="M 45 140 C 70 150 130 150 155 140" stroke-width="3" opacity="0.8" />
    <path d="M 60 162 C 80 168 120 168 140 162" stroke-width="2.5" opacity="0.75" />
    <path d="M 72 172 C 60 145 60 125 62 112" stroke-width="2.5" opacity="0.65" />
    <path d="M 128 172 C 140 145 140 125 138 112" stroke-width="2.5" opacity="0.65" />
  </g>

  <!-- Upper-Left Quadrant: Isometric Cargo Shipping Box -->
  <g transform="translate(56, 52)">
    <!-- Top Face of Box -->
    <polygon points="18,0 36,9 18,18 0,9" fill="#D3A076" stroke="#2E1810" stroke-width="2" stroke-linejoin="round" />
    <!-- Left Face of Box -->
    <polygon points="0,9 18,18 18,36 0,27" fill="#8B5330" stroke="#2E1810" stroke-width="2" stroke-linejoin="round" />
    <!-- Right Face of Box -->
    <polygon points="18,18 36,9 36,27 18,36" fill="#A86C43" stroke="#2E1810" stroke-width="2" stroke-linejoin="round" />
    <!-- Box Seam Tape -->
    <line x1="9" y1="4.5" x2="27" y2="13.5" stroke="#3D1F14" stroke-width="2" />
    <line x1="18" y1="18" x2="18" y2="36" stroke="#3D1F14" stroke-width="1.8" />
  </g>

  <!-- Lower-Right Quadrant: Quality / Compliance Seal -->
  <g transform="translate(112, 108)">
    <!-- Hexagon Frame -->
    <polygon points="20,2 35,11 35,29 20,38 5,29 5,11" fill="none" stroke="#8B5330" stroke-width="2.8" stroke-linejoin="round" />
    <!-- Subtle Quality Dots around vertices -->
    <circle cx="20" cy="-2" r="1.8" fill="#A56743" />
    <circle cx="39" cy="9" r="1.8" fill="#A56743" />
    <circle cx="39" cy="31" r="1.8" fill="#A56743" />
    <circle cx="20" cy="42" r="1.8" fill="#A56743" />
    <circle cx="1" cy="31" r="1.8" fill="#A56743" />
    <circle cx="1" cy="9" r="1.8" fill="#A56743" />
    <!-- Inner Verification Checkmark -->
    <path d="M 12 20 L 17 25 L 28 14" fill="none" stroke="#2E1810" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sweeping S-Curve Dual Arrow Ribbon (The Core Signature Emblem) -->
  <!-- Shadow/Dark Under-layer for 3D depth -->
  <path d="M 40 152 
           L 49 144
           C 65 130, 80 118, 98 106
           C 122 90, 148 76, 160 55
           L 152 50
           C 140 68, 116 82, 92 98
           C 74 110, 58 122, 40 152 Z" 
        fill="#1C0E0A" opacity="0.4" />

  <!-- Main Sweeping S-Band -->
  <path d="M 46 142 
           C 66 120, 82 110, 102 96
           C 126 79, 142 66, 150 48
           L 165 57
           C 155 77, 137 92, 114 109
           C 92 125, 74 136, 56 156 Z" 
        fill="url(#eximRibbonGrad)" 
        stroke="#23120C" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Outer Bevel Highlight on Ribbon Edge -->
  <path d="M 52 148 
           C 70 130, 88 120, 108 103
           C 130 85, 146 72, 156 52" 
        stroke="url(#eximHighlightGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Inner Loop Highlight -->
  <path d="M 44 136 
           C 62 114, 80 104, 100 89
           C 122 73, 138 60, 146 45" 
        stroke="#673922" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Top-Right Upward Arrowhead (Export) -->
  <g transform="translate(136, 18) rotate(48)">
    <polygon points="18,0 36,36 18,28 0,36" fill="url(#eximRibbonGrad)" stroke="#23120C" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Arrowhead Bevel -->
    <polygon points="18,0 18,28 0,36" fill="#8B5330" opacity="0.4" />
    <line x1="18" y1="0" x2="18" y2="28" stroke="#A56743" stroke-width="2" />
  </g>

  <!-- Bottom-Left Downward Arrowhead (Import) -->
  <g transform="translate(42, 172) rotate(228)">
    <polygon points="18,0 36,36 18,28 0,36" fill="url(#eximRibbonGrad)" stroke="#23120C" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Arrowhead Bevel -->
    <polygon points="18,0 18,28 0,36" fill="#8B5330" opacity="0.4" />
    <line x1="18" y1="0" x2="18" y2="28" stroke="#A56743" stroke-width="2" />
  </g>
</svg>
