# Nixpacks configuration for Export-Import Academy

[phases.setup]
nixPkgs = ["nodejs_22", "caddy"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npm run build",
  "mkdir -p /assets && cp Caddyfile /assets/Caddyfile"
]

[start]
cmd = "exec caddy run --config Caddyfile --adapter caddyfile 2>&1"

